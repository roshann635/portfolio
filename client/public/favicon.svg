<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --bg: #0B0B0D;
      --fg: #E9FF3D;
      --border: rgba(244, 244, 240, 0.2);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #EAE3D8;
        --fg: #0B6E77;
        --border: rgba(30, 27, 23, 0.2);
      }
    }
  </style>
  <!-- Background Plate -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" />
  
  <!-- Monogram R in Dossier Serif Style -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="var(--fg)" 
    font-family="'Fraunces', 'Georgia', serif" 
    font-size="20" 
    font-weight="700"
    letter-spacing="-0.5px"
  >R</text>
  
  <!-- Precision Corner Dot -->
  <circle cx="25" cy="7" r="1.5" fill="var(--fg)" />
</svg>